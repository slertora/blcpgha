[workspace]
members = [
    "blcpg-ha",
    "blcpg-cli"
, "blcpg-gui"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Santiago Lertora <santiagolertora@gmail.com>"]
license = "MIT"
description = "BLC PostgreSQL High Availability System"
repository = "https://github.com/santiagolertora/blcpgha"
keywords = ["postgresql", "high-availability", "raft", "database"]
categories = ["database", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
prometheus = "0.13"
prometheus-client = "0.22"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
futures = "0.3"
tokio-postgres = "0.7"
redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }
raft = "0.7"
tonic = "0.10"
prost = "0.12"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.13"
humantime = "2.1"
reqwest = { version = "0.11", features = ["json"] }
aws-config = "0.57"
aws-sdk-ec2 = "0.35"
aws-sdk-elasticloadbalancingv2 = "0.35"
